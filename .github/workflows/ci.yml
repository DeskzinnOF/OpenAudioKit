name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -e ".[cli,gui,api,dev]"
      - run: python -m pytest --cov --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[cli,gui,api,dev,docs]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/openaudiokit
      - run: python -m mkdocs build --strict
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/*.whl
          wheel-check/bin/python -I -c "from openaudiokit import Audio; assert Audio([0], 48000).frames == 1"
