name: Publish approved release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
      - run: python -m pip install -e ".[cli,gui,api,dev]"
      - name: Verify tag matches package metadata
        if: github.ref_type == 'tag'
        run: |
          python -c "import os, tomllib; v = tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME']; raise SystemExit(0 if tag == 'v' + v else 'Version/tag mismatch')"
      - run: python -m pytest --cov --cov-report=term
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - run: python tools/checksums.py dist "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
