[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openaudiokit"
version = "0.2.0"
description = "Offline digital audio analysis, processing, and quality control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
cli = ["typer>=0.15"]
gui = ["PyQt6>=6.6"]
api = [
  "fastapi>=0.123.1,<0.123.2; python_version < '3.11'",
  "fastapi>=0.163.2; python_version >= '3.11'",
  "uvicorn>=0.30",
  "python-multipart>=0.0.30",
]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6", "httpx>=0.27", "pyloudnorm>=0.1.1"]

[project.scripts]
openaudiokit = "openaudiokit.cli:main"
openaudiokit-gui = "openaudiokit.gui:main"
openaudiokit-api = "openaudiokit.api:main"

[project.urls]
Repository = "https://github.com/DeskzinnOF/OpenAudioKit"
Documentation = "https://deskzinnof.github.io/OpenAudioKit/"
Issues = "https://github.com/DeskzinnOF/OpenAudioKit/issues"
Changelog = "https://github.com/DeskzinnOF/OpenAudioKit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openaudiokit = ["py.typed", "logo.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "soundfile.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["openaudiokit"]
branch = true
omit = ["*/cli.py", "*/gui.py", "*/api.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
